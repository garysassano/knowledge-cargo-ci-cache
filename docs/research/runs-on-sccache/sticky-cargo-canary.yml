# Proposed experiment only; no measurements in this archive validate this workflow.
# Requires a configured RunsOn v3.2+ deployment and a trusted default-branch writer.
name: RunsOn Sticky Disk Canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sticky state to evaluate after the RunsOn v3.2 upgrade
        required: true
        type: choice
        default: cargo-inputs
        options:
          - cargo-inputs
          - cargo-inputs-and-target

permissions:
  contents: read

concurrency:
  group: sticky-canary-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  cargo-inputs:
    if: inputs.mode == 'cargo-inputs' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # The 20 GB sticky disk is illustrative; size it from measured Cargo input usage and cost.
    runs-on: runs-on=${{ github.run_id }}-sticky-inputs/cpu=16/image=ubuntu24-full-x64/sticky=rust-inputs-v1:20gb

    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Mount Sticky Cargo Inputs
        uses: runs-on/action@v2
        with:
          sticky_cache: rust
          sticky_wait_timeout: 15m

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build With Clean Target
        run: cargo build --workspace --release --locked

      - name: Report Sticky Cargo Input Usage
        if: always()
        shell: bash
        run: |
          du -sb "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true
          df -h "$HOME/.cargo"
          df -i "$HOME/.cargo"

  cargo-inputs-and-target:
    if: inputs.mode == 'cargo-inputs-and-target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # The 100 GB sticky disk is illustrative; measure target bytes and inodes before selecting a size.
    runs-on: runs-on=${{ github.run_id }}-sticky-target/cpu=16/image=ubuntu24-full-x64/extras=s3-cache/sticky=rust-target-v1:100gb

    env:
      CACHED_WORKTREE: ${{ github.workspace }}/cached-worktree
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/sticky-target

    defaults:
      run:
        working-directory: ${{ env.CACHED_WORKTREE }}

    steps:
      - name: Checkout Workflow Action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: examples/actions/cached-worktree-checkout

      - name: Mount Sticky Cargo Inputs And Target
        uses: runs-on/action@v2
        with:
          sticky_cache: |
            rust
            custom,path=sticky-target
          sticky_wait_timeout: 15m

      - name: Restore Mtime-Preserving Worktree
        uses: actions/cache@v6
        with:
          path: ${{ env.CACHED_WORKTREE }}
          key: sticky-worktree-v1-${{ github.repository_id }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sticky-worktree-v1-${{ github.repository_id }}-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Checkout Cached Worktree
        uses: ./examples/actions/cached-worktree-checkout
        with:
          path: ${{ env.CACHED_WORKTREE }}

      - name: Remove Untracked Worktree State
        run: git clean -ffdx

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build With Sticky Target
        run: cargo build --workspace --release --locked

      - name: Report Sticky Target Usage
        if: always()
        shell: bash
        run: |
          du -sb "$CARGO_TARGET_DIR" "$HOME/.cargo/registry" "$HOME/.cargo/git" 2>/dev/null || true
          find "$CARGO_TARGET_DIR" -xdev -type f -printf '.' 2>/dev/null | wc -c
          df -h "$CARGO_TARGET_DIR"
          df -i "$CARGO_TARGET_DIR"
