name: RunsOn Mise Input Cache

on:
  workflow_dispatch:
  push:
    paths:
      - app/**

permissions:
  contents: read

jobs:
  build:
    runs-on: runs-on=${{ github.run_id }}-cargo/cpu=16/image=ubuntu24-full-x64/extras=s3-cache

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise/rustup

    defaults:
      run:
        working-directory: ${{ github.workspace }}/app

    steps:
      - name: Setup RunsOn Magic Cache
        uses: runs-on/action@v2

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Toolchain And Tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          mise_toml: |
            [tools]
            zig = "0.16.0"
            rust = { version = "stable", components = "rustfmt", targets = "aarch64-unknown-linux-gnu" }
            cargo-binstall = "latest"
            # Add only the tools this job uses:
            # "cargo:cargo-lambda" = "1.9.1"
            # "cargo:trunk" = "0.21.14"

      # Configure private Cargo registry credentials here when required.

      # Remove this step for the no-cache variant or control.
      - name: Cache Cargo Registry And Git Inputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./app
          prefix-key: rust-inputs-v1
          cache-all-crates: false
          cache-bin: false
          cache-targets: false
          # Adapt the branch name if the repository's trusted default branch is not main.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --workspace --release --locked
