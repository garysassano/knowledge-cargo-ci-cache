name: Rust Cache Source-Keyed Target Cache

on:
  workflow_dispatch:
  push:
    paths:
      - app/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: "0"
      LOCAL_WORKSPACE: /tmp/example-workspace
      LOCAL_CARGO_TARGET_DIR: /tmp/example-cargo-target

    defaults:
      run:
        working-directory: /tmp/example-workspace/app

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            examples/actions/cached-worktree-checkout

      - name: Restore cached worktree
        uses: actions/cache@v6
        with:
          path: ${{ env.LOCAL_WORKSPACE }}
          key: workspace-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            workspace-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-

      - name: Checkout cached worktree
        uses: ./examples/actions/cached-worktree-checkout
        with:
          path: ${{ env.LOCAL_WORKSPACE }}
          sparse-paths: app

      - name: Configure Cargo target
        run: mkdir -p "$LOCAL_CARGO_TARGET_DIR"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo home only
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.LOCAL_WORKSPACE }}/app -> ../../example-cargo-target
          prefix-key: example-cargo-inputs-v1
          cache-targets: false
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Compute source and compiler key
        id: target-key
        working-directory: ${{ env.LOCAL_WORKSPACE }}
        run: |
          hash="$({
            git rev-parse HEAD:app
            git ls-files -s app
            rustc -Vv
          } | sha256sum | cut -d ' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore source-keyed target
        id: target-cache
        # Restore the full target directory after rust-cache. Restoring it before
        # rust-cache allows rust-cache cleanup to remove workspace artifacts.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LOCAL_CARGO_TARGET_DIR }}
          # rustc identity is in the hash. The literal namespace captures other
          # build-command semantics. There is no cross-identity fallback.
          key: target-release-locked-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.target-key.outputs.hash }}

      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ env.LOCAL_CARGO_TARGET_DIR }}
        run: cargo build --workspace --release --locked

      - name: Save source-keyed target from trusted branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LOCAL_CARGO_TARGET_DIR }}
          key: target-release-locked-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.target-key.outputs.hash }}
